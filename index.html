<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Global English & Skills | Registration</title>

    <link rel="stylesheet" href="style888.css">
</head>

<body>

    <!-- HEADER -->
    <header class="site-header">

        <div class="brand">

            <img src="logo.jpg" alt="Global English & Skills Logo">

            <div class="brand-copy">
                <h1>Global English <span>& Skills</span></h1>
                <p>Learn • Improve • Achieve</p>
            </div>

        </div>

        <div class="header-slogan">
            Better English,
            <strong>Brighter Future!</strong>
        </div>

    </header>


    <!-- MAIN CONTENT -->
    <main class="page-wrap">

        <form id="registrationForm" class="registration-card">

            <!-- STUDENT INFORMATION -->
            <section class="form-section">

                <h2 class="section-heading">
                    <span>♟</span>
                    Student Information
                </h2>

                <div class="form-grid">

                    <div class="field">

                        <label for="fullName">Full Name *</label>

                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="field">

                        <label for="phone">Phone Number *</label>

                        <div class="phone-input">

                            <span>+251</span>

                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                placeholder="9XXXXXXXX"
                                pattern="9[0-9]{8}"
                                title="Enter 9 digits starting with 9"
                                required
                            >

                        </div>

                    </div>


                    <div class="field">

                        <label for="email">
                            Email Address
                            <span>(Optional)</span>
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                        >

                    </div>


                    <div class="field">

                        <label for="telegram">
                            Telegram Username *
                        </label>

                        <input
                            type="text"
                            id="telegram"
                            name="telegram"
                            placeholder="@yourusername"
                            pattern="@?[A-Za-z0-9_]{5,32}"
                            title="Enter your valid Telegram username"
                            required
                        >

                        <small>
                            Enter your Telegram username so we can contact you.
                        </small>

                    </div>


                    <div class="field">

                        <label for="status">
                            Current Grade / Status *
                        </label>

                        <select id="status" name="status" required>
                            <option value="" disabled selected>Select your current status</option>
                            <option value="High School (Grade 9-12)">High School (Grade 9–12)</option>
                            <option value="University Freshman">University Freshman</option>
                            <option value="University Student (2nd Year+)">University Student (2nd Year+)</option>
                            <option value="Graduate / Professional">Graduate / Professional</option>
                            <option value="Other">Other</option>
                        </select>

                    </div>

                </div>

            </section>


            <!-- COURSE SELECTION -->
            <section class="form-section">

                <h2 class="section-heading">
                    <span>📚</span>
                    Select Course / Program *
                </h2>

                <div class="course-options">

                    <label class="radio-card">
                        <input type="radio" name="course" value="Spoken English & Communication" required>
                        <span>Spoken English & Communication</span>
                    </label>

                    <label class="radio-card">
                        <input type="radio" name="course" value="Academic & Grammar Mastery">
                        <span>Academic & Grammar Mastery</span>
                    </label>

                    <label class="radio-card">
                        <input type="radio" name="course" value="IELTS / TOEFL Prep">
                        <span>IELTS / TOEFL Prep</span>
                    </label>

                    <label class="radio-card">
                        <input type="radio" name="course" value="Mini Group Class">
                        <span>Mini Group Class</span>
                    </label>

                </div>

            </section>


            <!-- PAYMENT RECEIPT & MESSAGE -->
            <section class="form-section">

                <h2 class="section-heading">
                    <span>🧾</span>
                    Payment Receipt & Notes
                </h2>

                <div class="form-grid">

                    <div class="field">

                        <label for="receiptFile">
                            Upload Payment Receipt
                            <span>(Optional)</span>
                        </label>

                        <div class="file-upload-wrapper">
                            <input
                                type="file"
                                id="receiptFile"
                                name="receiptFile"
                                accept="image/*,.pdf"
                            >
                            <p id="fileNameDisplay" style="margin-top: 6px; font-size: 0.9rem; color: #758196;">
                                No file selected
                            </p>
                        </div>

                    </div>


                    <div class="field">

                        <label for="message">
                            Additional Message
                            <span>(Optional)</span>
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="3"
                            placeholder="Any questions or preferred schedule?"
                        ></textarea>

                    </div>

                </div>

            </section>


            <!-- FEEDBACK MESSAGE -->
            <div id="formMessage" class="form-message"></div>


            <!-- SUBMIT BUTTON -->
            <div class="form-actions">
                <button type="submit" id="submitBtn" class="btn-submit">
                    Register Now
                </button>
            </div>

        </form>

    </main>


    <!-- SUPABASE & SUBMISSION SCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://uuwfbzrezrthnchsohdq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_U8AWn6wAPtnVBs9REWtkEQ_Ge43u9U2';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('registrationForm');
        const fileInput = document.getElementById('receiptFile');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const submitBtn = document.getElementById('submitBtn');
        const formMessage = document.getElementById('formMessage');

        // Fix file chosen label display when user selects a file
        fileInput.addEventListener('change', () => {
            if (fileInput.files && fileInput.files.length > 0) {
                fileNameDisplay.textContent = '✅ Selected: ' + fileInput.files[0].name;
                fileNameDisplay.style.color = '#16a34a';
                fileNameDisplay.style.fontWeight = '600';
            } else {
                fileNameDisplay.textContent = 'No file selected';
                fileNameDisplay.style.color = '#758196';
                fileNameDisplay.style.fontWeight = 'normal';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const originalBtnText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Submitting...';
            formMessage.className = 'form-message';
            formMessage.textContent = '';

            try {
                let receiptUrl = null;

                if (fileInput.files && fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 8)}.${fileExt}`;

                    const { error: uploadError } = await supabase.storage
                        .from('receipts')
                        .upload(fileName, file);

                    if (!uploadError) {
                        const { data: publicUrlData } = supabase.storage
                            .from('receipts')
                            .getPublicUrl(fileName);
                        receiptUrl = publicUrlData.publicUrl;
                    }
                }

                const formData = {
                    full_name: document.getElementById('fullName').value.trim(),
                    phone: document.getElementById('phone').value.trim(),
                    email_address: document.getElementById('email').value.trim() || null,
                    telegram_id: document.getElementById('telegram').value.trim(),
                    grade_status: document.getElementById('status').value,
                    course: document.querySelector('input[name="course"]:checked')?.value || null,
                    receipt_url: receiptUrl,
                    additional_message: document.getElementById('message').value.trim() || null
                };

                const { error: insertError } = await supabase
                    .from('registrations')
                    .insert([formData]);

                if (insertError) {
                    throw insertError;
                }

                showFeedback('🎉 Registration successful! Your data has been saved and a Telegram notification has been sent.', 'success');
                form.reset();
                fileNameDisplay.textContent = 'No file selected';
                fileNameDisplay.style.color = '#758196';
                fileNameDisplay.style.fontWeight = 'normal';

            } catch (err) {
                console.error('Submission error:', err);
                showFeedback('❌ Submission failed: ' + (err.message || 'Please check your connection and try again.'), 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnText;
            }
        });

        function showFeedback(message, type) {
            formMessage.textContent = message;
            formMessage.className = 'form-message show ' + type;
            formMessage.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>

</body>

</html>
